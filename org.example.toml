# WACA Loop — 組織設定のテンプレート
#
# 使い方:
#   1. このファイルを org.toml という名前でコピーする（org.toml は git の管理外）
#        cp org.example.toml org.toml
#   2. 「CHANGE-ME」をすべて自分の組織の値に書き換える
#   3. 別の場所に置くときは環境変数 ORG_CONFIG でファイルを指定する
#
# CHANGE-ME が1つでも残っていると、サーバーと登録スクリプトは起動を止めて
# 直すべき箇所を表示する。記入例は sample/org.toml（架空の「サンプル協会」）。

[org]
# 組織名。画面やメッセージに表示される。
name = "CHANGE-ME"
# 組織の Google Workspace ドメイン。このドメインのアドレスで事前登録された人は、
# その Workspace が発行したアカウントでログインしたときだけ紐づく（退職者アドレスの再割り当て対策）。
# Workspace を使っていない場合は空の配列 [] にする。
workspace_domains = ["CHANGE-ME.example"]

[units]
# アクセス制御で特別な意味を持つユニットID。英小文字・数字・_ で付ける。
# 既定値のままでも動く。運用を始めた後に変えると、既存データのユニットIDと合わなくなるので注意。
org = "org"            # 全員が持つユニット（組織全体に公開）
steward = "steward"    # 共有層への昇格を承認する役割
board = "board"        # 決定を組織全体に公開できない単位（理事会・役員会など）
owner = "owner"        # WACA Loop の管理者（改善要望の見送りを決める）
# 1回の検索結果の上限を、理由を添えて超えられる役割（FLOOR-02）。空なら誰も超えられない。
export_admin = []

[guard]
# 「組織の業務の会話」と判断する手がかりの語。組織名・製品名・部署名・固有の用語などを並べる。
# 1つも書かないと、すべての会話を組織の業務として扱う。
org_keywords = ["CHANGE-ME"]
# 「組織の業務ではない」ことを示す語。組織の語が1つでもあればそちらが優先される。
non_org_signals = [
  "大学", "学部", "学科", "ゼミ", "講義", "学生", "学籍", "履修",
  "私事", "私用", "プライベート", "個人的な", "家族", "確定申告", "副業",
]

[unit_map]
# 組織シート上の部署名 → ユニットID。シート同期（scripts/sync_persons_from_sheet.py・
# sync_policy_from_sheet.py）で使う。シートを使わない場合は空のままでよい。
# 大文字・小文字、全角・半角、空白の違いは同期時に吸収される。
"CHANGE-ME" = "CHANGE-ME"

[person_ids]
# 任意。すでにログインで紐づいている人の person_id を、シート同期で変えないように固定する。
# "表示名" = "person_id"

[pii]
# 任意。組織固有の会員番号・IDの列名（例: "会員コード"）。個人データとして検出・遮断する。
# 「会員番号」「member_id」などの一般的な名前は組み込み済みなので、書かなくてよい。
id_column_names = []
# 任意。組織固有の会員番号・IDの形式（正規表現）。本文中に現れたら [会員番号] に置き換える。
# 例: 「ABC」に続く6桁以上の数字なら ["ABC[- ]?\\d{6,}"]（大文字・小文字は区別しない）。
id_value_patterns = []
